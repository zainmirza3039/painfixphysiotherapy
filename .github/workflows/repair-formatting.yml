name: Repair formatting and verify PR
on:
  push:
    branches:
      - fix/multan-clinician-directory-scope
permissions:
  contents: write
  actions: write
jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/multan-clinician-directory-scope
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format only files failing the existing lint gate
        run: bunx prettier --write src/components/admin/AdminShell.tsx src/routes/_authenticated/admin.blog-editor.tsx src/routes/clinical-resources.tsx
      - name: Verify tests, lint and production build
        run: bun run test && bun run lint && bun run build
      - name: Commit formatter-only changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- src/components/admin/AdminShell.tsx src/routes/_authenticated/admin.blog-editor.tsx src/routes/clinical-resources.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/admin/AdminShell.tsx src/routes/_authenticated/admin.blog-editor.tsx src/routes/clinical-resources.tsx
            git commit -m "style: format files required by CI"
            git push origin HEAD:fix/multan-clinician-directory-scope
          fi
      - name: Dispatch the repository CI workflow against the formatted commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zainmirza3039/painfixphysiotherapy/actions/workflows/ci.yml/dispatches \
            -d '{"ref":"fix/multan-clinician-directory-scope"}'
