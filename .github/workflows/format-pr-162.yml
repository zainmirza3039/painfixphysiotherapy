name: Format PR 162
on:
  push:
    branches:
      - fix/patient-ledger-portal-responsive-20261127
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format PR files
        run: |
          bunx prettier --write \
            src/components/admin/PatientTreatmentCertificate.tsx \
            'src/routes/_authenticated/admin.personal-patients.$patientId.tsx' \
            src/routes/_authenticated/admin.personal-patients.tsx \
            'src/routes/patient-portal.$token.tsx' \
            supabase/functions/issue-treatment-document/index.ts \
            supabase/functions/patient-portal/index.ts \
            tests/personal-patient-ledger.test.mjs \
            tests/personal-patient-treatment-certificate.test.mjs
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: format patient portal and certificate changes"
            git push
          fi
