name: Format PR 162 files

on:
  push:
    branches:
      - fix/patient-ledger-portal-responsive-20261127

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/patient-ledger-portal-responsive-20261127
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply repository Prettier formatting
        run: |
          bunx prettier --write \
            src/components/admin/PatientTreatmentCertificate.tsx \
            'src/routes/_authenticated/admin.personal-patients.$patientId.tsx' \
            src/routes/_authenticated/admin.personal-patients.tsx \
            'src/routes/patient-portal.$token.tsx' \
            supabase/functions/issue-treatment-document/index.ts \
            supabase/functions/patient-portal/index.ts \
            tests/personal-patient-ledger.test.mjs \
            tests/personal-patient-treatment-certificate.test.mjs
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/PatientTreatmentCertificate.tsx \
            'src/routes/_authenticated/admin.personal-patients.$patientId.tsx' \
            src/routes/_authenticated/admin.personal-patients.tsx \
            'src/routes/patient-portal.$token.tsx' \
            supabase/functions/issue-treatment-document/index.ts \
            supabase/functions/patient-portal/index.ts \
            tests/personal-patient-ledger.test.mjs \
            tests/personal-patient-treatment-certificate.test.mjs
          git commit -m "style: format patient portal and ledger changes"
          git push origin HEAD:fix/patient-ledger-portal-responsive-20261127
