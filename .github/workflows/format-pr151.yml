name: Format PR 151
on:
  push:
    branches:
      - feat/personal-ledger-calendar-hero-cta
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personal-ledger-calendar-hero-cta
      - uses: oven-sh/setup-bun@v2
      - name: Format changed implementation and test files
        run: |
          bunx prettier --write \
            src/admin/personal-patients.db.ts \
            src/admin/roles.ts \
            src/components/admin/AdminShell.tsx \
            src/components/site/Hero.tsx \
            src/integrations/supabase/types.ts \
            src/routeTree.gen.ts \
            src/routes/_authenticated/admin.clinician-ledgers.tsx \
            src/routes/_authenticated/admin.index.tsx \
            src/routes/_authenticated/admin.personal-patients.\$patientId.tsx \
            tests/homepage-local-seo.test.mjs \
            tests/homepage-physiotherapist-intent.test.mjs \
            tests/local-seo-intent.test.mjs \
            tests/personal-patient-calendar-cta.test.mjs \
            tests/personal-patient-ledger.test.mjs \
            tests/personal-patient-role-isolation.test.mjs \
            tests/personal-patient-super-admin-rpc.test.mjs
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format PR 151 implementation"
          git push origin HEAD:feat/personal-ledger-calendar-hero-cta
