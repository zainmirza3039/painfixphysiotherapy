name: Secret history scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-history:
    name: Scan all reachable Git history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all commits and refs with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          git log -p --all --full-history --no-ext-diff --no-textconv |
            docker run --rm -i ghcr.io/gitleaks/gitleaks:v8.30.1 stdin --verbose --redact --exit-code 1
