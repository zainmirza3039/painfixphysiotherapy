name: Format and verify PainFix SEO PR #163

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "src/data/blog.ts"
      - "tests/painfix-five-seo-guides.test.mjs"
      - ".github/format-trigger-163.txt"

permissions:
  contents: read

concurrency:
  group: painfix-seo-pr-163-format
  cancel-in-progress: false

jobs:
  format:
    if: github.event.pull_request.number == 163 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format only the two requested files
        run: npx --yes prettier@3.7.3 --write src/data/blog.ts tests/painfix-five-seo-guides.test.mjs

      - name: Remove trigger marker and push formatting commit
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/format-trigger-163.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog.ts tests/painfix-five-seo-guides.test.mjs .github/format-trigger-163.txt
          if ! git diff --cached --quiet; then
            git commit -m "style: format SEO guides [skip ci]"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

  verify:
    needs: format
    if: github.event.pull_request.number == 163 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out updated PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
