name: Format and verify PainFix SEO PR #163

on:
  push:
    branches:
      - content/painfix-five-multan-guides-20261128
    paths:
      - ".github/format-trigger-163.txt"
      - "src/data/blog.ts"
      - "tests/painfix-five-seo-guides.test.mjs"

permissions:
  contents: write

concurrency:
  group: painfix-seo-pr-163-format
  cancel-in-progress: false

jobs:
  format-and-verify:
    if: github.repository == 'zainmirza3039/painfixphysiotherapy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format the two PR files
        run: npx --yes prettier@3.7.3 --write src/data/blog.ts tests/painfix-five-seo-guides.test.mjs

      - name: Remove one-time trigger and commit formatting
        run: |
          rm -f .github/format-trigger-163.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/blog.ts tests/painfix-five-seo-guides.test.mjs .github/format-trigger-163.txt
          if ! git diff --cached --quiet; then
            git commit -m "style: format SEO guides [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
